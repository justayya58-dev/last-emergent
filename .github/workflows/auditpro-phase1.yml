name: AuditPro Phase 1 regression

on:
  pull_request:
    branches: [main]
    paths:
      - "backend/**"
      - "frontend/src/App.tsx"
      - "docs/auditpro-phase1-security.md"
      - ".github/workflows/auditpro-phase1.yml"
  push:
    branches: [main]
    paths:
      - "backend/**"
      - "frontend/src/App.tsx"
      - "docs/auditpro-phase1-security.md"
      - ".github/workflows/auditpro-phase1.yml"

jobs:
  backend-regression:
    runs-on: ubuntu-latest
    services:
      mongodb:
        image: mongo:7
        ports:
          - 27017:27017
        options: >-
          --health-cmd "mongosh --quiet --eval 'db.runCommand({ ping: 1 }).ok'"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10
    defaults:
      run:
        working-directory: backend
    env:
      MONGO_URL: mongodb://127.0.0.1:27017
      DB_NAME: auditpro_ci
      AUDITPRO_ADMIN_USERNAME: auditpro-admin
      AUDITPRO_ADMIN_PASSWORD: ci-only-password-123456
      AUDITPRO_SESSION_SECRET: ci-only-session-secret-0123456789-abcdefghijklmnopqrstuvwxyz
      CORS_ORIGINS: http://localhost:3000
      COOKIE_SECURE: "false"
      BACKEND_URL: http://127.0.0.1:8001
      PYTHONPATH: ${{ github.workspace }}/.ci-stubs
      EMERGENT_LLM_KEY: ci-only-test-key
      AUDITPRO_TEST_OCR: "true"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - name: Install public backend dependencies
        run: |
          python -m pip install --upgrade pip
          grep -v "^emergentintegrations==" requirements.txt > /tmp/requirements-ci.txt
          pip install -r /tmp/requirements-ci.txt
      - name: Compile backend
        run: python -m compileall -q .
      - name: Start API
        run: |
          uvicorn server:app --host 127.0.0.1 --port 8001 > /tmp/auditpro-api.log 2>&1 &
          for attempt in $(seq 1 45); do
            if curl --silent --fail http://127.0.0.1:8001/api/ > /dev/null; then exit 0; fi
            sleep 2
          done
          cat /tmp/auditpro-api.log
          exit 1
      - name: Run complete backend test suite
        run: pytest -q tests/

  frontend-quality:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Enable Yarn classic
        run: |
          corepack enable
          corepack prepare yarn@1.22.22 --activate
      - name: Install frontend dependencies
        run: yarn install --ignore-scripts --non-interactive
      - name: Typecheck frontend
        run: yarn typecheck
      - name: Build frontend
        run: yarn build

# Production migration preflight and runtime configuration regression gates.
